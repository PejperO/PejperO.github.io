<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Redirecting…</title>
        <script>
            var redirectTo = location.pathname + location.search + location.hash;
            location.replace("?redirect=" + encodeURIComponent(redirectTo));
        </script>
    </head>
    <body>
        <p>Redirecting to home…</p>
    </body>
</html>
